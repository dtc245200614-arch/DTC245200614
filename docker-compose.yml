name: expense-tracker

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]            # no published port, internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *hardening
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, frontend, monitoring]

  pgadmin:
    <<: *hardening
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:5050:80"        # reachable from the host only
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, frontend]

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine   # runs as non-root (uid 101)
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [app]
    networks: [frontend, monitoring]

  # ---------------- Commit 2: Monitoring ----------------
  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    cap_drop: [ALL]
    read_only: true
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, monitoring]

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    cap_drop: [ALL]
    read_only: true
    networks: [monitoring]

  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true               # required by cAdvisor to read container cgroups
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1   # runs as user "nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    networks: [monitoring, frontend]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0    # runs as uid 472
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    cap_drop: [ALL]
    networks: [monitoring, frontend]

  # ---------------- Commit 3: Centralized logging ----------------
  loki:
    <<: *hardening
    image: grafana/loki:3.1.1        # runs as uid 10001
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    cap_drop: [ALL]
    networks: [monitoring]

  promtail:
    <<: *hardening
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    user: "0:0"                      # needs read access to the docker socket (mounted read-only)
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    cap_drop: [ALL]
    depends_on: [loki]
    networks: [monitoring]

networks:
  frontend:
  monitoring:
    internal: true                  # monitoring plane isolated from outside
  backend:
    internal: true                  # DB is unreachable from outside / the internet

volumes:
  pgdata:
  pgadmin:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
