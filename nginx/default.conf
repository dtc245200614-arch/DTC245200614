# JSON access log -> easy to query in Loki with `| json`
log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
                            '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                            '"request_time":$request_time,"user_agent":"$http_user_agent"}';
access_log /dev/stdout json;
error_log  /dev/stderr warn;

limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server_tokens off;

server {
    listen 8080;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:5m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    # Internal metrics must never be exposed publicly
    location = /metrics { return 404; }

    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Internal-only listener for the nginx-prometheus-exporter (monitoring network)
server {
    listen 8081;
    access_log off;
    location = /stub_status { stub_status; }
}
